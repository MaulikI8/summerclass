{% extends 'master/base.html' %}
{% block title %}Write Blog | Islington Marketplace{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold mb-3"><i class="fas fa-pen-nib text-primary me-2"></i> Write a Blog Post</h4>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row g-2 mb-2">
            <div class="col-6"><label class="small fw-bold">Category *</label><select name="category_id" class="form-select form-select-sm rounded-3" required>{% for cat in categories %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}</select></div>
            <div class="col-6"><label class="small fw-bold">Tag</label><select name="tag" class="form-select form-select-sm rounded-3"><option value="Discussion">Discussion</option><option value="Question">Question</option><option value="Guide">Guide</option><option value="Review">Review</option></select></div>
          </div>
          <div class="mb-2"><label class="small fw-bold">Title *</label><input type="text" name="title" class="form-control form-control-sm rounded-3" placeholder="Blog title" required/></div>
          <div class="mb-2"><label class="small fw-bold">Content *</label><textarea name="content" rows="6" class="form-control form-control-sm rounded-3" placeholder="Share your experience or question..." required></textarea></div>
          <div class="mb-3"><label class="small fw-bold">Photo (Optional)</label><input type="file" name="post_image" class="form-control form-control-sm rounded-3" accept="image/*"/></div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'blog' %}" class="btn btn-sm btn-light rounded-pill px-3">Cancel</a>
            <button type="submit" class="btn btn-sm btn-primary rounded-pill px-4 fw-bold">Publish Post</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
