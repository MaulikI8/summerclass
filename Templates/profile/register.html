{% extends 'master/base.html' %}
{% block title %}Student Register | Islington Marketplace{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7 col-sm-11">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold text-center mb-3">Join Islington Marketplace</h4>
        {% if messages %}{% for m in messages %}<div class="alert alert-danger py-2 small rounded-3">{{ m }}</div>{% endfor %}{% endif %}
        <form method="POST" action="{% url 'student_register' %}">
          {% csrf_token %}
          <div class="row g-2 mb-2"><div class="col-6"><label class="small fw-bold">First Name</label><input type="text" name="first_name" class="form-control form-control-sm rounded-3" value="{{ form_data.first_name|default:'' }}" required/></div><div class="col-6"><label class="small fw-bold">Last Name</label><input type="text" name="last_name" class="form-control form-control-sm rounded-3" value="{{ form_data.last_name|default:'' }}" required/></div></div>
          <div class="mb-2"><label class="small fw-bold">Username</label><input type="text" name="username" class="form-control form-control-sm rounded-3" value="{{ form_data.username|default:'' }}" required/></div>
          <div class="mb-2"><label class="small fw-bold">Email Address</label><input type="email" name="email" class="form-control form-control-sm rounded-3" value="{{ form_data.email|default:'' }}" placeholder="name@islington.edu.np" required/></div>
          <div class="row g-2 mb-3"><div class="col-6"><label class="small fw-bold">Password</label><input type="password" name="password" class="form-control form-control-sm rounded-3" required/></div><div class="col-6"><label class="small fw-bold">Confirm</label><input type="password" name="confirm_password" class="form-control form-control-sm rounded-3" required/></div></div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3">Create Account</button>
          <div class="text-center small text-muted">Already registered? <a href="{% url 'student_login' %}" class="fw-bold text-primary">Sign In</a></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
