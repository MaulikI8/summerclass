{% extends 'master/base.html' %}
{% block title %}Student Sign In | Islington Marketplace{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-4 col-md-6 col-sm-10">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold text-center mb-3">Student Sign In</h4>
        {% if messages %}{% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}success{% endif %} py-2 small rounded-3">{{ m }}</div>{% endfor %}{% endif %}
        <form method="POST" action="{% url 'student_login' %}">
          {% csrf_token %}
          <div class="mb-3"><label class="small fw-bold">Username</label><input type="text" name="username" class="form-control form-control-sm rounded-3" value="{{ saved_username|default:'' }}" required autofocus/></div>
          <div class="mb-3"><label class="small fw-bold">Password</label><input type="password" name="password" class="form-control form-control-sm rounded-3" required/></div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3">Sign In</button>
          <div class="text-center small text-muted">Don't have an account? <a href="{% url 'student_register' %}" class="fw-bold text-primary">Register</a></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
